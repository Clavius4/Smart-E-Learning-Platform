name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd /root/smart-learning-platform-docker
            git fetch origin main
            git reset --hard origin/main
            # .env is not in git; restore from the server-side backup if missing
            [ -f .env ] || cp /root/smart-learning-secrets/.env .env
            docker-compose up -d --build
            docker image prune -f
            echo "--- containers ---"
            docker-compose ps
            echo "--- health check ---"
            sleep 10
            curl -sf http://localhost:5000/api/health && echo " HEALTH OK"
